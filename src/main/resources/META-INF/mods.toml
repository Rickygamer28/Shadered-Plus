description='''Shadered+ for Shadered 1.3.7 - 1.4.2 (Forge 1.20.1): the OIIA Cat model block (and the Big OIIA Cat from a cube of cats), and the Island Scanner, which turns an area into a floating miniature Sky Island (mobs included) for pedestals and Island Paintings. The six Shadered+ skies need Shadered 1.4.3 or newer (the other 1.20.1 version of Shadered+).

Requires Shadered by Noodlegamer76 (https://github.com/Noodlegamer76/Shadered, CC BY-NC 4.0); made with the author's permission.
Shadered+ is an unofficial addon, not made by the Shadered author.'''

