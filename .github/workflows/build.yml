name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Which Shadered / GeckoLib versions exist for Forge 1.20.1 (shown as notices on the run).
      - name: List dependency versions
        continue-on-error: true
        run: |
          curl -s 'https://api.modrinth.com/v2/project/shadered/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D' \
            | python3 -c "import json,sys; print('::notice::shadered forge 1.20.1: ' + ', '.join(v['version_number'] for v in json.load(sys.stdin)[:12]))"
          curl -s 'https://api.modrinth.com/v2/project/geckolib/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D' \
            | python3 -c "import json,sys; print('::notice::geckolib forge 1.20.1: ' + ', '.join(v['version_number'] for v in json.load(sys.stdin)[:6]))"

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      # Show Java compile errors as annotations on the run (readable without opening the log).
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error:" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shadered-plus-jar
          path: build/libs/*.jar
