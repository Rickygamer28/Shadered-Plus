name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Which Shadered / GeckoLib versions exist for Forge 1.20.1 (shown as notices on the run).
      - name: List dependency versions
        continue-on-error: true
        run: |
          curl -s 'https://api.modrinth.com/v2/project/shadered/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D' \
            | python3 -c "import json,sys; print('::notice::shadered forge 1.20.1: ' + ', '.join(v['version_number'] for v in json.load(sys.stdin)[:12]))"
          curl -s 'https://api.modrinth.com/v2/project/geckolib/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D' \
            | python3 -c "import json,sys; print('::notice::geckolib forge 1.20.1: ' + ', '.join(v['version_number'] for v in json.load(sys.stdin)[:6]))"

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      # Show Java compile errors as annotations on the run (readable without opening the log).
      - name: Report compile errors
        if: failure()
        run: |
          # GitHub shows at most 10 error notes per step: pack up to 30 errors into each note.
          grep -E "(\.java:[0-9]+: error:|^> |error: )" build.log | sed 's#.*/src/main/java/##' | awk '!seen[$0]++' > errors.txt || true
          echo "errors: $(wc -l < errors.txt)"
          split -l 30 errors.txt part_
          for f in $(ls part_* 2>/dev/null | head -10); do
            echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' $f)"
          done

      # Quick look inside the finished jar (shown as notices on the run).
      - name: Check jar
        if: success()
        run: |
          ls build/libs build/devlibs 2>/dev/null | tr '\n' ' ' | sed 's/^/::notice::files: /'; echo
          J=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "::notice::jar $J: $(unzip -l $J | grep -cE '\.class$') classes; refmap: $(unzip -l $J | grep -c refmap); mods.toml: $(unzip -l $J | grep -c META-INF/mods.toml)"
          echo "::notice::manifest: $(unzip -p $J META-INF/MANIFEST.MF | tr -d '\r' | grep -i mixin | tr '\n' ' ')"
          echo "::notice::refmap: $(unzip -p $J skyblocks.refmap.json | tr -d '\n ' | head -c 600)"
          mkdir -p chk && cd chk && unzip -q -o ../$J 'com/example/skyblocks/client/island/IslandMesh*.class'
          echo "::notice::srg names in IslandMesh: $(strings com/example/skyblocks/client/island/IslandMesh.class | grep -cE '^m_[0-9]+_$'), mojang names: $(strings com/example/skyblocks/client/island/IslandMesh.class | grep -cE '^(renderBatched|getBlockModel|renderLiquid)$')"
          cd .. && grep -ciE "warning.*mixin|mixin.*warn" build.log | sed 's/^/::notice::mixin warnings: /'

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shadered-plus-jar
          path: build/libs/*.jar
