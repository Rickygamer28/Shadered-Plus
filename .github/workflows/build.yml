name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      # Show Java compile errors as annotations on the run (readable without opening the log).
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error:" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Probe bucket textures
        run: |
          J=$(find ~/.gradle build -name "*.jar" 2>/dev/null | while read f; do unzip -l "$f" 2>/dev/null | grep -q "assets/minecraft/textures/item/water_bucket.png" && echo "$f" && break; done | head -1)
          echo "jar: $J"
          mkdir -p probe && cd probe && unzip -q -o "$J" assets/minecraft/textures/item/water_bucket.png assets/minecraft/textures/item/bucket.png
          python3 - <<'PY'
          from PIL import Image
          for n in ['bucket','water_bucket']:
              im=Image.open('assets/minecraft/textures/item/%s.png'%n).convert('RGBA')
              rows=[]
              for y in range(im.size[1]):
                  rows.append(' '.join('%02x%02x%02x%02x'%im.getpixel((x,y)) for x in range(im.size[0])))
              for i in range(0,16,8):
                  print('::notice::%s %d: %s' % (n, i, ' | '.join(rows[i:i+8])))
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shadered-plus-jar
          path: build/libs/*.jar
