name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Which Shadered / GeckoLib versions exist for Forge 1.20.1 (shown as notices on the run).
      - name: List dependency versions
        continue-on-error: true
        run: |
          curl -s 'https://api.modrinth.com/v2/project/shadered/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D' \
            | python3 -c "import json,sys; print('::notice::shadered forge 1.20.1: ' + ', '.join(v['version_number'] for v in json.load(sys.stdin)[:12]))"
          curl -s 'https://api.modrinth.com/v2/project/geckolib/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D' \
            | python3 -c "import json,sys; print('::notice::geckolib forge 1.20.1: ' + ', '.join(v['version_number'] for v in json.load(sys.stdin)[:6]))"

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      # Show Java compile errors as annotations on the run (readable without opening the log): GitHub keeps
      # 10 notes of each level per step and cuts long ones, so the errors go out in ~3.5 KB pieces as errors,
      # warnings and notices (30 pieces).
      - name: Report compile errors
        if: failure()
        run: |
          grep -E -A3 "\.java:[0-9]+: error:" build.log | grep -vE "^\s*\^\s*$|^--$|warning: \[removal\]" | sed 's#.*/src/main/java/##' | cut -c1-220 > errors.txt || true
          echo "errors: $(grep -c ': error:' errors.txt)"
          python3 - <<'PY'
          lines = open('errors.txt').read().split('\n')
          parts, cur = [], ''
          for l in lines:
              if len(cur) + len(l) > 3400:
                  parts.append(cur); cur = ''
              cur += l + '\n'
          if cur: parts.append(cur)
          levels = ['error'] * 10 + ['warning'] * 10 + ['notice'] * 10
          for lvl, p in zip(levels, parts):
              print('::%s::%s' % (lvl, p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')))
          PY

      # Quick look inside the finished jar (shown as notices on the run).
      - name: Check jar
        if: success()
        run: |
          ls build/libs build/devlibs 2>/dev/null | tr '\n' ' ' | sed 's/^/::notice::files: /'; echo
          J=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "::notice::jar $J: $(unzip -l $J | grep -cE '\.class$') classes; refmap: $(unzip -l $J | grep -c refmap); mods.toml: $(unzip -l $J | grep -c META-INF/mods.toml)"
          echo "::notice::manifest: $(unzip -p $J META-INF/MANIFEST.MF | tr -d '\r' | grep -i mixin | tr '\n' ' ')"
          echo "::notice::refmap: $(unzip -p $J skyblocks.refmap.json | tr -d '\n ' | head -c 600)"
          mkdir -p chk && cd chk && unzip -q -o ../$J 'com/example/skyblocks/client/island/IslandMesh*.class'
          echo "::notice::srg names in IslandMesh: $(strings com/example/skyblocks/client/island/IslandMesh.class | grep -cE '^m_[0-9]+_$'), mojang names: $(strings com/example/skyblocks/client/island/IslandMesh.class | grep -cE '^(renderBatched|getBlockModel|renderLiquid)$')"
          cd .. && grep -iE "warning" build.log | grep -v "deprecat" | head -8 | sed 's/^/::notice::/'

      # Start the 1.20.1 Forge client (virtual screen, software graphics) with Shadered and this mod, wait until
      # the game has loaded its resources (title screen), then report what happened.
      - name: Client load test
        if: success()
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5
          (xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1 &)
          for i in $(seq 1 120); do
            sleep 5
            if grep -qE "textures/atlas/blocks.png-atlas|Crash report saved|Failed to start|BUILD FAILED" client.log; then sleep 25; break; fi
          done
          pkill -f "runClient|DevLaunch|minecraft" ; sleep 3
          echo "::notice::client loaded resources: $(grep -c 'blocks.png-atlas' client.log), crash reports: $(grep -c 'Crash report saved' client.log), log lines: $(wc -l < client.log)"
          grep -E "skyblocks|Shadered\+|Mixin apply|mixin.*(fail|error)|Exception|ERROR|FATAL|Caused by" client.log \
            | grep -vE "DEBUG|Mixin subsystem|SpongePowered MIXIN|sodium|embeddium|Narrator|narrator|OpenAL|ALSA|Failed to load library|realms|Realms|telemetry" \
            | awk '!seen[$0]++' | head -60 > summary.txt
          echo "::notice::shader lines: $(grep -iE 'Shadered\+ shader|shader.*(fail|error|compile)|GLSL|Invalid shader' client.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-6000)"
          echo "::notice::our log lines: $(grep -E 'SkyBlocksMod|sky usage|Shadered\+' client.log | head -8 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3000)"
          split -l 15 summary.txt cli_
          for f in $(ls cli_* 2>/dev/null | head -6); do echo "::notice::$(sed ':a;N;$!ba;s/\n/%0A/g' $f | cut -c1-7000)"; done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shadered-plus-1.20.1
          path: build/libs/*.jar
