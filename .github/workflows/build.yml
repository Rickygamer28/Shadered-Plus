name: Build mod

on:
  push:
    branches-ignore: [ 'ci-shots*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      # Show Java compile errors as annotations on the run (readable without opening the log).
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error:" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shadered-plus-jar
          path: build/libs/*.jar

      # Every shader through the reference GLSL compiler (strict, like AMD's drivers: NVIDIA lets more through).
      - name: Check shaders (strict compiler)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq glslang-tools > /dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools > /dev/null)
          python3 .github/tools/check_shaders.py src/main/resources/assets

      # A dedicated server must start with the mod (client-only code reached on a server crashes it).
      - name: Server start test
        continue-on-error: true
        run: |
          set +e
          mkdir -p run && echo "eula=true" > run/eula.txt
          (gradle runServer --no-daemon > server.log 2>&1 &)
          for i in $(seq 1 90); do
            sleep 5
            if grep -qE "Done \(|Crash report saved|Failed to start|BUILD FAILED|Exception in server tick loop" server.log; then sleep 3; break; fi
          done
          pkill -f "runServer|DevLaunch|minecraft" ; sleep 3
          if grep -q "Done (" server.log; then echo "::notice::server started fine"; else
            echo "::error::server did not start: $(grep -E 'Exception|Error|Caused by|crash' server.log | head -20 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-5000)"; fi

      # The render test: a flat world with the mod's blocks, screenshots from a few spots (client/RenderTest); the
      # pictures and the log are pushed to the ci-shots-1.21.1 branch.
      - name: Render test
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5
          # Sodium 0.6 and the newest Iris made for it, for NeoForge 1.21.1 (the second run: with them, no shader pack)
          cat > pick.py <<'PY'
          import json, sys, urllib.request
          q = '?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D'
          get = lambda p: json.load(urllib.request.urlopen('https://api.modrinth.com/v2/project/' + p + '/version' + q))
          allsodium = get('sodium')
          sodium = {v['id']: v['version_number'] for v in allsodium if '-0.6.' in v['version_number']}
          newest06 = [v['version_number'] for v in allsodium if '-0.6.' in v['version_number']][0]
          iris = get('iris')
          for v in iris:
              for d in v.get('dependencies', []):
                  if d.get('version_id') in sodium:
                      print(sodium[d['version_id']], v['version_number']); sys.exit()
          # (no exact pairing listed: the newest Iris from before Sodium moved past 0.6)
          later = min([v['date_published'] for v in allsodium if '-0.6.' not in v['version_number'] and '-0.5.' not in v['version_number']] or ['9999'])
          print(newest06, [v['version_number'] for v in iris if v['date_published'] < later][0])
          PY
          read SODIUM IRIS < <(sed 's/^          //' pick.py | python3)
          echo "::notice::sodium $SODIUM, iris $IRIS"
          for v in plain sodium; do
            EXTRA=""; [ $v = sodium ] && EXTRA="-PsodiumVersion=$SODIUM -PirisVersion=$IRIS"
            (SKYBLOCKS_RENDER_TEST=$v xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient $EXTRA --no-daemon > client_$v.log 2>&1 &)
            for i in $(seq 1 200); do
              sleep 5
              if grep -qE "render test done|Crash report saved|BUILD FAILED" client_$v.log; then sleep 5; break; fi
            done
            pkill -f "runClient|DevLaunch|minecraft" ; sleep 5
            echo "::notice::render test $v: $(grep -E 'render test|Shadered\+ shaders after' client_$v.log | grep -v 'burst' | head -25 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-5000)"
          done
          cp client_plain.log client.log
          grep -E "skyblocks|Shadered\+|mixin.*(fail|error)|Exception|ERROR|FATAL|Caused by" client.log \
            | grep -vE "DEBUG|Mixin subsystem|SpongePowered MIXIN|Narrator|narrator|OpenAL|ALSA|Failed to load library|realms|Realms|telemetry" \
            | awk '!seen[$0]++' | head -45 > summary.txt
          split -l 15 summary.txt cli_
          for f in $(ls cli_* 2>/dev/null | head -3); do echo "::notice::$(sed ':a;N;$!ba;s/\n/%0A/g' $f | cut -c1-7000)"; done
          mkdir -p shots && cp run/screenshots/rendertest_*.png shots/ 2>/dev/null
          cp client.log shots/render.log; cp client_sodium.log shots/render_sodium.log; cp server.log shots/server.log 2>/dev/null
          echo "::notice::screenshots: $(ls shots | grep -v _f | tr '\n' ' ')"
          cd shots && git init -q && git checkout -q -b ci-shots-1.21.1 && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "render test ${GITHUB_SHA}" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots-1.21.1
