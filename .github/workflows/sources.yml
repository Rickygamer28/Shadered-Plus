name: Dump MC sources
on:
  push:
    branches: [src-dump]
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - run: gradle createMinecraftArtifacts --no-daemon || gradle compileJava --no-daemon || true
      - if: always()
        run: |
          set +e
          mkdir -p src_out
          find build ~/.gradle . -name "*.jar" > src_out/jars.txt 2>/dev/null
          for J in $(grep -iE "sources|client|neoforge|minecraft" src_out/jars.txt); do
            unzip -l "$J" 2>/dev/null | grep -qE "ItemInHandRenderer.java|textures/item/crossbow_standby.png" && echo "$J" >> src_out/used.txt && unzip -q -o "$J" 'net/minecraft/client/renderer/ItemInHandRenderer.java' 'net/minecraft/client/renderer/entity/layers/ItemInHandLayer.java' 'net/minecraft/client/renderer/entity/player/PlayerRenderer.java' 'net/minecraft/client/model/HumanoidModel.java' 'net/minecraft/client/model/AnimationUtils.java' 'net/minecraft/client/renderer/block/model/ItemTransform.java' 'net/minecraft/client/renderer/entity/ItemRenderer.java' 'net/minecraft/client/renderer/entity/LivingEntityRenderer.java' 'net/minecraft/client/model/geom/ModelPart.java' 'net/minecraft/client/model/PlayerModel.java' 'net/minecraft/client/renderer/GameRenderer.java' 'net/neoforged/neoforge/client/extensions/common/IClientItemExtensions.java' 'assets/minecraft/textures/item/bow*.png' 'assets/minecraft/textures/item/crossbow*.png' 'assets/minecraft/textures/item/diamond_sword.png' 'assets/minecraft/models/item/bow*.json' 'assets/minecraft/models/item/crossbow*.json' 'assets/minecraft/models/item/handheld.json' 'assets/minecraft/models/item/generated.json' -d src_out/
          done
          find src_out -type f > src_out/files.txt
          exit 0
      - if: always()
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAv24sj1rv5P+hel89q16/
          ECWbRn4UVwIYSa6N89FyPs/LIKWdl2kDDFv4lQo7kH7vJxkdD/EF3fgP/oab3D2g
          NU3HSPgHEglFWW5rp2JHeiv0Hn7H8FlpPwLuBukVITwCDqHxyHjjj7YhA0a/hN8D
          Qi58s9LMkzEdzTABGiq0qx6D4Zbz/Vimq8WZIRfsONlkCK8kItsE2yvrBcQ0lD8J
          Ut0iv3Vv/w5DQTrHjZwrdLJ47T1E7V/4msSiZwXCNVw3wgAslrdL1mJZ87iJhRD0
          FN1GE00TBhaw/cgd/ltd/8gnJDVZnEsYCW3oUe+DIB64ieucDi9ITp9x3v3BU07y
          5wIDAQAB
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          tar czf out.tgz src_out
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -in out.tgz -out out.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out k.enc
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan src-dump-out; git rm -rfq --cached .; git add -f out.enc k.enc; git commit -qm out; git push -f origin src-dump-out
