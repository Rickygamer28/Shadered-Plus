plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'com.example.skyblocks'
base { archivesName = 'shadered-plus' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArguments.add '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    // Shadered is downloaded from Modrinth's maven at build time.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // GeckoLib (Shadered's skyblock items are GeckoLib items, so the compiler needs it too)
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // JEI (only its API, for our structure pages; JEI itself is optional)
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

// The television's video player: FFmpeg (LGPL build) through JavaCV/JavaCPP, packed inside our jar with its natives
// for Windows, Linux and macOS (no other mod needed). Compiled against, on the dev game's classpath, and copied into
// the jar (see jar below).
configurations {
    bundle { transitive = false }
    compileOnly.extendsFrom bundle
    additionalRuntimeClasspath.extendsFrom bundle
}

dependencies {
    def cpp = '1.5.11'
    bundle "org.bytedeco:javacv:${cpp}"
    bundle "org.bytedeco:javacpp:${cpp}"
    bundle "org.bytedeco:ffmpeg:7.1-${cpp}"
    ['linux-x86_64', 'windows-x86_64', 'macosx-x86_64', 'macosx-arm64'].each { p ->
        bundle "org.bytedeco:javacpp:${cpp}:${p}"
        bundle "org.bytedeco:ffmpeg:7.1-${cpp}:${p}"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.bundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', '**/module-info.class', 'META-INF/maven/**'
    }
}

dependencies {
    // Shadered+ is an addon: it compiles against Shadered and needs Shadered (and Shadered's own
    // dependencies, e.g. GeckoLib and Sodium) installed in the game. Not bundled into our jar.
    compileOnly "maven.modrinth:shadered:${shadered_version}"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // only for running the game from Gradle (and the CI load test), not part of our jar
    runtimeOnly "maven.modrinth:shadered:${shadered_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // (the CI render test's second run: with Sodium and Iris, no shader pack - versions found on Modrinth by the CI)
    if (project.hasProperty('sodiumVersion')) {
        runtimeOnly "maven.modrinth:sodium:${project.sodiumVersion}"
    }
    if (project.hasProperty('irisVersion')) {
        runtimeOnly "maven.modrinth:iris:${project.irisVersion}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}
