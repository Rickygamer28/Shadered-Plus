plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.78'
}

version = mod_version
group = 'com.example.skyblocks'
base { archivesName = "shadered-plus-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client { client() }
        server { server(); programArguments.add '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.sodium.mixins.json"
}

repositories {
    mavenCentral()
    // Shadered is downloaded from Modrinth's maven at build time.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // GeckoLib (Shadered's skyblock items are GeckoLib items, so the compiler needs it too)
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*'; includeGroup 'com.eliotlash.mclib' }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    // Shadered+ is an addon: it compiles against Shadered and needs Shadered (and Shadered's own
    // dependencies, e.g. GeckoLib) installed in the game. Not bundled into our jar.
    modCompileOnly "maven.modrinth:shadered:${shadered_version}"
    modCompileOnly "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    // only for running the game from Gradle (and the CI load test), not part of our jar
    modRuntimeOnly "maven.modrinth:shadered:${shadered_version}"
    modRuntimeOnly "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
}

jar {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json,${mod_id}.sodium.mixins.json"])
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
